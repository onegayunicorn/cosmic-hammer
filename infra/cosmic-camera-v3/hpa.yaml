apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: cosmic-camera, namespace: cosmic-camera}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: cosmic-camera}
  minReplicas: 2
  maxReplicas: 10
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
